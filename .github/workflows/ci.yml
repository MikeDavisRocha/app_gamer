name: CI Pipeline

# Dispara o workflow em todo push ou pull request na main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Sobe um banco Postgres isolado para os testes de integração
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: app_gamer_test
        ports:
          - 5432:5432
        # Healthcheck para garantir que o banco subiu antes de rodar os testes
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Instalar Dependências
        run: poetry install --no-interaction --no-root

      - name: Rodar Testes (Unitários e Integração)
        env:
          # Variáveis de ambiente para o teste conectar no banco do GitHub Actions
          DATABASE_URL: postgresql+asyncpg://user_test:password_test@localhost:5432/app_gamer_test
          SECRET_KEY: testing_secret_key_123
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          PROJECT_NAME: "Gamer API Test"
        run: |
          poetry run pytest -v